<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2 大单历史</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ddd;
            padding: 20px;
        }

        .container { max-width: 1600px; margin: 0 auto; }

        .nav-links {
            text-align: center;
            margin-bottom: 30px;
        }
        .nav-links a {
            color: #007acc;
            text-decoration: none;
            padding: 8px 16px;
            margin: 0 10px;
            border: 1px solid #007acc;
            border-radius: 4px;
            transition: all 0.2s;
            display: inline-block;
        }
        .nav-links a:hover { background-color: #007acc; color: white; }
        .nav-links a.active { background-color: #007acc; color: white; }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 14px;
        }
        .title { font-size: 1.4em; color: #ddd; font-weight: normal; }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; }
        .filter-group select, .filter-group input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ddd;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 13px;
        }
        .filter-group select { cursor: pointer; }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #666;
        }
        .stat-item { display: flex; gap: 5px; align-items: center; }
        .stat-val { color: #aaa; font-weight: 600; }

        .refresh-info { font-size: 12px; color: #666; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #252525;
            border-radius: 8px;
            overflow: hidden;
            font-size: 13px;
        }
        th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #2e2e2e; }
        th {
            background: #2f2f2f;
            color: #999;
            font-weight: 600;
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 1;
            cursor: pointer;
            user-select: none;
        }
        th:hover { color: #ccc; }
        th.sorted { color: #007acc; }
        th:first-child, td:first-child { text-align: center; width: 36px; color: #555; }
        th:nth-child(2), td:nth-child(2) { text-align: left; }
        th:nth-child(3), td:nth-child(3) { text-align: left; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #2a2a2a; }

        .symbol { font-weight: 600; color: #fff; }
        .up   { color: #26a69a; }
        .down { color: #ef5350; }
        .flat { color: #777; }

        /* trend_type 标签 */
        .tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tag-new     { background: rgba(0,122,204,0.2);   color: #4db8ff; border: 1px solid rgba(0,122,204,0.4); }
        .tag-changed { background: rgba(255,152,0,0.15);  color: #ffac30; border: 1px solid rgba(255,152,0,0.35); }
        .tag-stable  { background: rgba(100,100,100,0.15);color: #888;    border: 1px solid #444; }

        /* alert_type 方向标签 */
        .side-bid { color: #26a69a; font-weight: 700; }
        .side-ask { color: #ef5350; font-weight: 700; }

        /* 变化列 */
        .change-cell { white-space: nowrap; }
        .arrow-up   { color: #26a69a; }
        .arrow-down { color: #ef5350; }

        /* 档位 */
        .level-badge {
            display: inline-block;
            background: #333;
            color: #aaa;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 11px;
        }

        /* 倍数 */
        .ratio { color: #faac30; font-weight: 600; }

        /* 时间 */
        .time-cell { color: #666; font-size: 12px; white-space: nowrap; }

        /* flash 动画 */
        @keyframes flashNew  { 0%{background:rgba(0,122,204,0.3)}  100%{background:transparent} }
        @keyframes flashChg  { 0%{background:rgba(255,152,0,0.3)}  100%{background:transparent} }
        .flash-new { animation: flashNew 0.8s ease-out; }
        .flash-chg { animation: flashChg 0.8s ease-out; }

        .loading { text-align: center; padding: 40px; color: #666; }
        .error   { text-align: center; padding: 40px; color: #ef5350; }
        .empty   { text-align: center; padding: 30px; color: #555; font-size: 13px; }

        @media (max-width: 900px) {
            .header-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
            .filter-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="nav-links">
        <a href="/alerts">价格提醒</a>
        <a href="/volume-alerts">放量提醒</a>
        <a href="/hills">山丘形态</a>
        <a href="/hill-alerts">山丘放量</a>
        <a href="/ranking">涨跌排名</a>
        <a href="/l2-alerts" class="active">L2大单</a>
    </div>

    <div class="header-bar">
        <h1 class="title">L2 大单历史</h1>
        <div class="controls">
            <span class="refresh-info" id="refresh-timer">1s 后刷新</span>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>方向</label>
            <select id="filter-side">
                <option value="all">全部</option>
                <option value="bid">买盘</option>
                <option value="ask">卖盘</option>
            </select>
        </div>
        <div class="filter-group">
            <label>类型</label>
            <select id="filter-trend">
                <option value="all">全部</option>
                <option value="new_entry">新增大单</option>
                <option value="changed">大单变化</option>
                <option value="stable">持稳</option>
            </select>
        </div>
        <div class="filter-group">
            <label>时间范围</label>
            <select id="filter-time">
                <option value="10">近10分钟</option>
                <option value="30">近30分钟</option>
                <option value="60" selected>近60分钟</option>
                <option value="0">今日全部</option>
            </select>
        </div>
        <div class="filter-group">
            <label>代码</label>
            <input type="text" id="filter-symbol" placeholder="如 BABA.BL" style="width:110px">
        </div>
        <div class="filter-group">
            <label>最小倍数</label>
            <input type="number" id="filter-ratio" value="0" min="0" step="1" style="width:60px">
        </div>
        <div class="filter-group">
            <label>挂单价</label>
            <input type="number" id="filter-min-price" placeholder="最低" style="width:60px" min="0" step="0.001">
            <span style="color:#666">-</span>
            <input type="number" id="filter-max-price" placeholder="最高" style="width:60px" min="0" step="0.001">
        </div>
        <div class="filter-group">
            <label>挂单量</label>
            <input type="number" id="filter-min-volume" placeholder="最小" style="width:70px" min="0" step="1">
            <span style="color:#666">-</span>
            <input type="number" id="filter-max-volume" placeholder="最大" style="width:70px" min="0" step="1">
        </div>
        <div class="filter-group">
            <label>最小交易量</label>
            <input type="number" id="filter-min-trade-vol" value="0" min="0" step="1" style="width:80px" oninput="debounceFetch()">
        </div>
        <div class="filter-group">
            <label>显示条数</label>
            <select id="filter-limit">
                <option value="50">50条</option>
                <option value="100" selected>100条</option>
                <option value="200">200条</option>
                <option value="500">500条</option>
            </select>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <div id="content"><div class="loading">正在加载...</div></div>

</div>

<script>
    let allData = [];
    let sortCol = 'created_at';
    let sortDir = 'desc';
    let countdown = 1;
    let knownIds = new Set();
    let flashIds = {};   // id -> 'new' | 'chg'

    const TREND_LABELS = {
        new_entry: { text: '新增大单', cls: 'tag-new' },
        changed:   { text: '大单变化', cls: 'tag-changed' },
        stable:    { text: '持稳',     cls: 'tag-stable' },
    };

    let debounceTimer = null;

    function debounceFetch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => fetchData(), 500);
    }

    function buildApiUrl() {
        const mins  = document.getElementById('filter-time').value;
        const limit = document.getElementById('filter-limit').value;
        const minTradeVol = document.getElementById('filter-min-trade-vol').value;
        const params = new URLSearchParams({ limit });
        if (mins !== '0') params.set('minutes', mins);
        if (minTradeVol && minTradeVol !== '0') params.set('min_volume', minTradeVol);
        return `/api/l2-alert-history?${params}`;
    }

    async function fetchData() {
        try {
            const res = await fetch(buildApiUrl());
            if (!res.ok) throw new Error(res.statusText);
            const raw = await res.json();

            // 检测新条目和变化条目，打 flash 标记
            const newFlash = {};
            raw.forEach(r => {
                if (!knownIds.has(r.id)) {
                    newFlash[r.id] = r.trend_type === 'changed' ? 'chg' : 'new';
                    knownIds.add(r.id);
                }
            });
            flashIds = newFlash;

            allData = raw;
            renderTable();
            renderStats();
            countdown = 1;
        } catch (e) {
            console.error('fetch error:', e);
            if (!allData.length) {
                document.getElementById('content').innerHTML =
                    `<div class="error">加载失败: ${e.message}</div>`;
            }
        }
    }

    function applyFilters(data) {
        const side   = document.getElementById('filter-side').value;
        const trend  = document.getElementById('filter-trend').value;
        const symbol = document.getElementById('filter-symbol').value.trim().toUpperCase();
        const ratio  = parseFloat(document.getElementById('filter-ratio').value) || 0;
        
        const minPrice = parseFloat(document.getElementById('filter-min-price').value);
        const maxPrice = parseFloat(document.getElementById('filter-max-price').value);
        const minVolume = parseFloat(document.getElementById('filter-min-volume').value);
        const maxVolume = parseFloat(document.getElementById('filter-max-volume').value);

        return data.filter(r => {
            if (side !== 'all' && r.alert_type !== side) return false;
            if (trend !== 'all' && r.trend_type !== trend) return false;
            if (symbol && !r.stock_code.toUpperCase().includes(symbol)) return false;
            if (ratio > 0 && (Number(r.price_ratio) || 0) < ratio) return false;
            
            const price = Number(r.price) || 0;
            if (!isNaN(minPrice) && price < minPrice) return false;
            if (!isNaN(maxPrice) && price > maxPrice) return false;
            
            const volume = Number(r.volume) || 0;
            if (!isNaN(minVolume) && volume < minVolume) return false;
            if (!isNaN(maxVolume) && volume > maxVolume) return false;

            return true;
        });
    }

    function sortData(data) {
        return [...data].sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            if (sortCol === 'created_at') {
                va = new Date(va); vb = new Date(vb);
            } else {
                va = Number(va) || 0; vb = Number(vb) || 0;
            }
            return sortDir === 'desc' ? (vb > va ? 1 : -1) : (va > vb ? 1 : -1);
        });
    }

    function fmtVol(v) {
        v = Number(v);
        if (isNaN(v)) return '—';
        return v >= 1000 ? v.toLocaleString() : String(v);
    }

    function fmtPrice(v) {
        v = Number(v);
        return isNaN(v) ? '—' : v.toFixed(2);
    }

    function fmtPct(v) {
        v = Number(v);
        if (isNaN(v) || v === 0) return '';
        return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    }

    function fmtTime(s) {
        if (!s) return '—';
        const d = new Date(s);
        return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function buildChangeCell(row) {
        const tt = row.trend_type;
        if (tt === 'new_entry') return '<span style="color:#555">首次出现</span>';
        if (tt === 'stable')    return '<span style="color:#555">持稳</span>';

        const parts = [];

        // 价格变化
        const pPct = Number(row.price_change_ratio);
        if (Math.abs(pPct) >= 1 && row.prev_price != null) {
            const arrow = pPct > 0
                ? '<span class="arrow-up">↗</span>'
                : '<span class="arrow-down">↘</span>';
            parts.push(
                `价 ${fmtPrice(row.prev_price)}→${fmtPrice(row.price)} ${arrow} `
                + `<span class="${pPct > 0 ? 'up' : 'down'}">${fmtPct(pPct)}</span>`
            );
        }

        // 量变化
        const vPct = Number(row.volume_change_ratio);
        if (Math.abs(vPct) >= 20 && row.prev_volume != null) {
            const arrow = vPct > 0
                ? '<span class="arrow-up">↑</span>'
                : '<span class="arrow-down">↓</span>';
            parts.push(
                `量 ${fmtVol(row.prev_volume)}→${fmtVol(row.volume)} ${arrow} `
                + `<span class="${vPct > 0 ? 'up' : 'down'}">${fmtPct(vPct)}</span>`
            );
        }

        // 档位变化
        const ld = Number(row.level_delta);
        if (ld !== 0 && row.prev_level != null) {
            const dir = ld < 0
                ? `<span class="arrow-up">↑前移${Math.abs(ld)}档</span>`
                : `<span class="arrow-down">↓后退${Math.abs(ld)}档</span>`;
            parts.push(`档 L${row.prev_level}→L${row.level} ${dir}`);
        }

        if (parts.length === 0) return '<span style="color:#555">微变</span>';
        return parts.join('&emsp;');
    }

    function renderTable() {
        const filtered = applyFilters(allData);
        const sorted   = sortData(filtered);

        if (!sorted.length) {
            document.getElementById('content').innerHTML =
                '<div class="empty">暂无符合条件的记录</div>';
            return;
        }

        const thIcon = col => {
            if (sortCol !== col) return '<span style="color:#444">↕</span>';
            return sortDir === 'desc' ? '↓' : '↑';
        };
        const thCls = col => sortCol === col ? 'sorted' : '';

        let html = `<table>
            <thead><tr>
                <th>#</th>
                <th onclick="handleSort('stock_code')"       class="${thCls('stock_code')}">代码 ${thIcon('stock_code')}</th>
                <th onclick="handleSort('alert_type')"       class="${thCls('alert_type')}">方向 ${thIcon('alert_type')}</th>
                <th onclick="handleSort('level')"            class="${thCls('level')}">档位 ${thIcon('level')}</th>
                <th onclick="handleSort('price')"            class="${thCls('price')}">挂单价 ${thIcon('price')}</th>
                <th onclick="handleSort('volume')"           class="${thCls('volume')}">挂单量 ${thIcon('volume')}</th>
                <th onclick="handleSort('price_ratio')"      class="${thCls('price_ratio')}">倍数 ${thIcon('price_ratio')}</th>
                <th onclick="handleSort('trend_type')"       class="${thCls('trend_type')}">类型 ${thIcon('trend_type')}</th>
                <th style="min-width:320px;text-align:left">变化详情</th>
                <th onclick="handleSort('created_at')"       class="${thCls('created_at')}">时间 ${thIcon('created_at')}</th>
            </tr></thead>
            <tbody>`;

        sorted.forEach((row, i) => {
            const trend   = TREND_LABELS[row.trend_type] || { text: row.trend_type, cls: 'tag-stable' };
            const sideEl  = row.alert_type === 'bid'
                ? '<span class="side-bid">买</span>'
                : '<span class="side-ask">卖</span>';
            const ratio   = Number(row.price_ratio);
            const ratioEl = ratio > 0 ? `<span class="ratio">${ratio.toFixed(1)}x</span>` : '—';

            const flashCls = flashIds[row.id] === 'chg' ? 'flash-chg'
                           : flashIds[row.id] === 'new' ? 'flash-new' : '';

            html += `<tr class="${flashCls}">
                <td>${i + 1}</td>
                <td class="symbol">${row.stock_code}</td>
                <td>${sideEl}</td>
                <td><span class="level-badge">L${row.level}</span></td>
                <td>${fmtPrice(row.price)}</td>
                <td>${fmtVol(row.volume)}</td>
                <td>${ratioEl}</td>
                <td><span class="tag ${trend.cls}">${trend.text}</span></td>
                <td class="change-cell" style="text-align:left">${buildChangeCell(row)}</td>
                <td class="time-cell">${fmtTime(row.created_at)}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        document.getElementById('content').innerHTML = html;
    }

    function renderStats() {
        const filtered = applyFilters(allData);
        const total    = filtered.length;
        const newCnt   = filtered.filter(r => r.trend_type === 'new_entry').length;
        const chgCnt   = filtered.filter(r => r.trend_type === 'changed').length;
        const stbCnt   = filtered.filter(r => r.trend_type === 'stable').length;
        const bidCnt   = filtered.filter(r => r.alert_type === 'bid').length;
        const askCnt   = filtered.filter(r => r.alert_type === 'ask').length;

        document.getElementById('stats-bar').innerHTML = `
            <div class="stat-item">共 <span class="stat-val">${total}</span> 条</div>
            <div class="stat-item">新增 <span class="stat-val" style="color:#4db8ff">${newCnt}</span></div>
            <div class="stat-item">变化 <span class="stat-val" style="color:#ffac30">${chgCnt}</span></div>
            <div class="stat-item">持稳 <span class="stat-val">${stbCnt}</span></div>
            <div class="stat-item">买盘 <span class="stat-val up">${bidCnt}</span></div>
            <div class="stat-item">卖盘 <span class="stat-val down">${askCnt}</span></div>
        `;
    }

    function handleSort(col) {
        if (sortCol === col) {
            sortDir = sortDir === 'desc' ? 'asc' : 'desc';
        } else {
            sortCol = col;
            sortDir = 'desc';
        }
        renderTable();
    }

    // 筛选变化时立即重渲染（不重新请求）
    ['filter-side','filter-trend','filter-symbol','filter-ratio', 'filter-min-price', 'filter-max-price', 'filter-min-volume', 'filter-max-volume'].forEach(id => {
        document.getElementById(id).addEventListener('input',  () => { renderTable(); renderStats(); });
        document.getElementById(id).addEventListener('change', () => { renderTable(); renderStats(); });
    });

    // 时间范围和条数变化时重新请求
    ['filter-time','filter-limit'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => fetchData());
    });

    // 倒计时刷新
    fetchData();
    setInterval(() => {
        countdown--;
        if (countdown <= 0) {
            fetchData();
        } else {
            document.getElementById('refresh-timer').textContent = `${countdown}s 后刷新`;
        }
    }, 1000);
</script>
</body>
</html>
