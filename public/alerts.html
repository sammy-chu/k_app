<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K线提醒列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ddd;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links a {
            color: #007acc;
            text-decoration: none;
            padding: 8px 16px;
            margin: 0 10px;
            border: 1px solid #007acc;
            border-radius: 4px;
            transition: all 0.2s;
            display: inline-block;
        }

        .nav-links a:hover {
            background-color: #007acc;
            color: white;
        }

        .alerts-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .alerts-title {
            font-size: 1.5em;
            color: #ddd;
            font-weight: normal;
        }

        .alerts-list {
            list-style: none;
            padding: 0;
        }

        .alert-item {
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alert-item:last-child {
            border-bottom: none;
        }

        .alert-symbol {
            font-weight: bold;
            color: #ffffff;
            min-width: 80px;
        }

        .alert-time {
            color: #888;
            min-width: 120px;
            font-size: 13px;
        }

        .alert-amplitude {
            font-weight: bold;
            min-width: 80px;
        }

        .alert-direction {
            min-width: 20px;
            font-size: 16px;
        }

        .alert-prices {
            color: #888;
            font-size: 13px;
            flex: 1;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
        }

        .no-alerts {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* 振幅颜色 */
        .amp-high { color: #ff4757; }
        .amp-medium { color: #ffa502; }
        .amp-low { color: #2ed573; }
        .amp-minimal { color: #70a1ff; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .alert-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                padding: 12px 0;
            }

            .alert-symbol,
            .alert-time,
            .alert-amplitude,
            .alert-direction {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">📈 K线图表</a>
            <a href="/alerts">🔔 提醒列表</a>
        </div>

        <div class="alerts-header">
            <h2 class="alerts-title">提醒列表（最近）</h2>
        </div>

        <ul class="alerts-list" id="alerts-list">
            <li class="loading">正在加载提醒数据...</li>
        </ul>
    </div>

    <script>
        // 格式化北京时间 - 简化格式
        function formatBeijingTime(isoString) {
            const date = new Date(isoString);
            const beijingTime = new Date(date.getTime() + (8 * 60 * 60 * 1000));
            return beijingTime.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).replace(/\//g, '/');
        }

        // 获取方向指示器
        function getDirectionIndicator(direction) {
            switch(direction) {
                case 1: return '↑';
                case -1: return '↓';
                default: return '→';
            }
        }

        // 获取振幅CSS类
        function getAmplitudeClass(amplitude) {
            const amp = parseFloat(amplitude);
            if (amp >= 5) return 'amp-high';
            if (amp >= 3) return 'amp-medium';
            if (amp >= 1) return 'amp-low';
            return 'amp-minimal';
        }

        // 渲染提醒列表 - 简洁单行格式
        function renderAlerts(alerts) {
            const alertsList = document.getElementById('alerts-list');
            
            if (!alerts || alerts.length === 0) {
                alertsList.innerHTML = '<li class="no-alerts">暂无提醒数据</li>';
                return;
            }

            alertsList.innerHTML = alerts.map(alert => {
                const amplitude = (parseFloat(alert.amplitude_pct) * 100).toFixed(2);
                const direction = getDirectionIndicator(alert.direction);
                const amplitudeClass = getAmplitudeClass(amplitude);
                const time = formatBeijingTime(alert.created_at);
                const open = parseFloat(alert.open).toFixed(4);
                const close = parseFloat(alert.close).toFixed(4);
                
                return `
                    <li class="alert-item">
                        <span class="alert-symbol">${alert.symbol}</span>
                        <span class="alert-time">${time}</span>
                        <span class="alert-amplitude ${amplitudeClass}">振幅 ${amplitude}%</span>
                        <span class="alert-direction">${direction}</span>
                        <span class="alert-prices">O:${open} C:${close}</span>
                    </li>
                `;
            }).join('');
        }

        // 加载提醒数据
        async function loadAlerts() {
            try {
                const response = await fetch('/api/alerts?limit=50');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const alerts = await response.json();
                console.log('Loaded alerts:', alerts.length);
                
                renderAlerts(alerts);
            } catch (error) {
                console.error('Error loading alerts:', error);
                document.getElementById('alerts-list').innerHTML = 
                    '<li class="error">加载提醒数据失败，请稍后重试</li>';
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Alerts page loaded');
            
            // 立即加载一次数据
            loadAlerts();
            
            // 每10秒自动刷新
            setInterval(loadAlerts, 10000);
        });
    </script>
</body>
</html>
