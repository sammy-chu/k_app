<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大单监控筛选</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #ddd; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #444; text-align: left; transition: background-color 0.5s ease; }
        th { background: #333; }
        .flash-up { background-color: rgba(38, 166, 154, 0.4) !important; }
        .flash-down { background-color: rgba(239, 83, 80, 0.4) !important; }
        .flash-new { background-color: rgba(255, 255, 255, 0.2) !important; }
    </style>
</head>
<body>
    <div class="container">
        <h2>大单监控筛选 (大单表 + 今日量价)</h2>
        <div style="margin-bottom: 15px; background: #2a2a2a; padding: 15px; border-radius: 5px;">
            <div style="margin-bottom: 10px;">
                <label>最小挂单量: <input type="number" id="min-order-vol" value="1000"></label>
                <label style="margin-left:15px;">日总成交量: <input type="number" id="min-total-vol" value="0"> <span style="font-size: 0.9em; color: #888;">(前端过滤)</span></label>
                <label style="margin-left:15px;">监控时间窗口(分钟): <input type="number" id="time-window" value="60"></label>
                <label style="margin-left:15px;">方向: 
                    <select id="side-filter">
                        <option value="all">全部</option>
                        <option value="bid">只看买盘</option>
                        <option value="ask">只看卖盘</option>
                    </select>
                    <span style="font-size: 0.9em; color: #888;">(前端过滤)</span>
                </label>
            </div>
            <div>
                <label>最新价: 
                    <input type="number" id="min-price" placeholder="最低价" style="width: 80px;"> 
                    - 
                    <input type="number" id="max-price" placeholder="最高价" style="width: 80px;">
                </label>
                <span style="font-size: 0.9em; color: #888; margin-left: 10px;">(前端过滤)</span>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>股票代码</th>
                    <th>方向</th>
                    <th>挂单价</th>
                    <th>最新价</th>
                    <th>挂单量</th>
                    <th>日总成交量</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="6">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <script>
        let fetchTimer;
        let displayedOrders = []; // 前端状态队列，最多保留 20 条
        
        function buildUrl() {
            const minOrderVol = document.getElementById('min-order-vol').value || 0;
            const timeWindow = document.getElementById('time-window').value || 5;
            return `/api/large-orders-screener?min_order_volume=${minOrderVol}&time_window_mins=${timeWindow}`;
        }

        async function fetchData() {
            try {
                const res = await fetch(buildUrl());
                if (!res.ok) throw new Error('Network response error');
                let data = await res.json();
                
                // --- 前端过滤：买卖方向 ---
                const side = document.getElementById('side-filter').value;
                if (side !== 'all') {
                    data = data.filter(row => row.side === side);
                }

                // --- 前端过滤：日总成交量 ---
                const minTotalVolStr = document.getElementById('min-total-vol').value;
                const minTotalVol = minTotalVolStr !== '' ? Number(minTotalVolStr) : 0;
                
                if (minTotalVol > 0) {
                    data = data.filter(row => Number(row.total_volume) >= minTotalVol);
                }

                // --- 前端过滤：最新价区间 ---
                const minPriceStr = document.getElementById('min-price').value;
                const maxPriceStr = document.getElementById('max-price').value;
                
                if (minPriceStr !== '' || maxPriceStr !== '') {
                    const minPrice = minPriceStr !== '' ? Number(minPriceStr) : -Infinity;
                    const maxPrice = maxPriceStr !== '' ? Number(maxPriceStr) : Infinity;
                    
                    data = data.filter(row => {
                        const currentPrice = Number(row.current_price);
                        return currentPrice >= minPrice && currentPrice <= maxPrice;
                    });
                }
                
                renderTable(data);
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="7" style="color:red;">加载失败: ${err.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            
            // 处理清空数据的情况
            if (data.length === 0 && displayedOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无符合条件的大单数据</td></tr>';
                return;
            } else if (data.length > 0 && tbody.querySelector('td[colspan]')) {
                tbody.innerHTML = ''; // 清除"加载中"或"暂无数据"提示
            }

            // 反向遍历新数据，这样 unshift 才能保持最新的在最上面
            for (let i = data.length - 1; i >= 0; i--) {
                const row = data[i];
                const orderKey = row.symbol + '-' + row.side;
                
                // 在现有队列中查找
                const existingIndex = displayedOrders.findIndex(item => item.symbol + '-' + item.side === orderKey);
                
                if (existingIndex > -1) {
                    // 已存在，擦写式更新
                    const existingData = displayedOrders[existingIndex];
                    const tr = document.getElementById('row-' + orderKey);
                    if (tr) {
                        // 更新最新价
                        if (Number(existingData.current_price) !== Number(row.current_price)) {
                            const priceTd = tr.querySelector('.td-price');
                            const oldPrice = Number(existingData.current_price);
                            const newPrice = Number(row.current_price);
                            priceTd.innerText = newPrice.toFixed(2);
                            
                            // 闪烁效果
                            const flashClass = newPrice > oldPrice ? 'flash-up' : 'flash-down';
                            priceTd.classList.add(flashClass);
                            setTimeout(() => priceTd.classList.remove(flashClass), 500);
                        }
                        
                        // 更新成交量
                        if (Number(existingData.total_volume) !== Number(row.total_volume)) {
                            const volTd = tr.querySelector('.td-vol');
                            volTd.innerText = row.total_volume;
                        }
                        
                        // 更新挂单价/挂单量
                        tr.querySelector('.td-order-price').innerText = Number(row.order_price).toFixed(2);
                        tr.querySelector('.td-order-vol').innerText = row.order_volume;
                    }
                    
                    // 更新内部数据状态
                    displayedOrders[existingIndex] = row;
                } else {
                    // 新数据，插入到头部
                    displayedOrders.unshift(row);
                    
                    const sideColor = row.side === 'bid' ? '#26a69a' : '#ef5350';
                    const sideText = row.side === 'bid' ? '买盘' : '卖盘';
                    
                    const tr = document.createElement('tr');
                    tr.id = 'row-' + orderKey;
                    tr.innerHTML = `
                        <td style="font-weight:bold;">${row.symbol}</td>
                        <td style="color:${sideColor};">${sideText} (L${row.level})</td>
                        <td class="td-order-price">${Number(row.order_price).toFixed(2)}</td>
                        <td class="td-price">${Number(row.current_price).toFixed(2)}</td>
                        <td class="td-order-vol">${row.order_volume}</td>
                        <td class="td-vol">${row.total_volume}</td>
                    `;
                    
                    // 新行闪烁效果
                    tr.classList.add('flash-new');
                    setTimeout(() => tr.classList.remove('flash-new'), 500);
                    
                    tbody.insertBefore(tr, tbody.firstChild);
                }
            }

            // 保持最多 20 条，溢出的从 DOM 和数组中移除
            while (displayedOrders.length > 20) {
                const removedItem = displayedOrders.pop();
                const trToRemove = document.getElementById('row-' + removedItem.symbol + '-' + removedItem.side);
                if (trToRemove) {
                    trToRemove.remove();
                }
            }
        }

        // 绑定事件
        ['min-order-vol', 'min-total-vol', 'time-window', 'side-filter', 'min-price', 'max-price'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                fetchData();
                // 重置定时器
                clearInterval(fetchTimer);
                fetchTimer = setInterval(fetchData, 1000);
            });
        });

        // 初始加载与自动刷新
        fetchData();
        fetchTimer = setInterval(fetchData, 1000); // 每 1 秒刷新一次
    </script>
</body>
</html>
